<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #F9FAFB;
      color: #111827;
      font-size: 14px;
      min-height: 100vh;
    }
    a, button { font-family: inherit; }

    .page { padding: 32px 40px; max-width: 1184px; margin: 0 auto; }

    h1 { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 20px; }

    /* ── Back link ── */
    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px; color: #374151; text-decoration: none;
      margin-bottom: 12px;
    }
    .back-link:hover { color: #111827; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 6px;
      height: 40px; padding: 0 16px;
      background: #155DFC; color: #fff;
      border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      text-decoration: none;
    }
    .btn-primary:hover { background: #1249CC; }

    /* ── Table card ── */
    .table-card {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #E5E7EB;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr { background: #F9FAFB; border-bottom: 1px solid #E5E7EB; }
    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 13px; font-weight: 600; color: #374151;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #E5E7EB; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #FAFAFA; }
    td {
      padding: 14px 16px;
      font-size: 14px; color: #374151;
      vertical-align: middle;
    }

    .id-col { font-weight: 500; color: #6B7280; width: 80px; }
    .name-col { font-weight: 600; color: #111827; }
    .desc-col { color: #6B7280; font-size: 13px; }
    .count-col { color: #374151; text-align: center; width: 100px; }

    /* ── System badge ── */
    .badge-system {
      display: inline-flex; align-items: center;
      height: 22px; padding: 0 8px;
      background: #F3F4F6; color: #6B7280;
      border-radius: 9999px;
      font-size: 11px; font-weight: 500;
      margin-left: 6px; vertical-align: middle;
    }

    /* ── Action buttons ── */
    .action-cell { display: flex; align-items: center; gap: 6px; }
    .btn-edit {
      display: inline-flex; align-items: center;
      height: 30px; padding: 0 12px;
      background: #EFF6FF; color: #155DFC;
      border: 1px solid #BFDBFE; border-radius: 5px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      text-decoration: none;
    }
    .btn-edit:hover { background: #DBEAFE; }
    .btn-delete {
      display: inline-flex; align-items: center;
      height: 30px; padding: 0 12px;
      background: #FEF2F2; color: #EF4444;
      border: 1px solid #FECACA; border-radius: 5px;
      font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .btn-delete:hover { background: #FEE2E2; }
    .btn-delete-disabled {
      display: inline-flex; align-items: center;
      height: 30px; padding: 0 12px;
      background: #F9FAFB; color: #D1D5DB;
      border: 1px solid #E5E7EB; border-radius: 5px;
      font-size: 13px; cursor: not-allowed;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-top: 20px; padding-bottom: 32px;
    }
    .pagination-info { font-size: 13px; color: #6B7280; }
    .page-btns { display: flex; align-items: center; gap: 4px; }
    .page-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border-radius: 6px; border: 1px solid #D1D5DB;
      background: #fff; color: #374151;
      font-size: 14px; cursor: pointer; font-weight: 500;
    }
    .page-btn:hover { background: #F3F4F6; }
    .page-btn.active { background: #111827; color: #fff; border-color: #111827; }
    .page-btn.arrow { border: none; background: none; font-size: 18px; width: 28px; }
    .page-btn.arrow:hover { background: none; color: #111827; }
  </style>
</head>
